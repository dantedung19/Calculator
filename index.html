<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tip Calculator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f5;
        --card: #ffffff;
        --ink: #1c2b24;
        --muted: #5d6f67;
        --line: #d7e2dc;
        --accent: #0f7a5a;
        --accent-soft: #e6f5ef;
        --shadow: 0 18px 40px rgba(28, 43, 36, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at top left, #e9f3ee 0, transparent 40%),
          var(--bg);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(440px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 32px 28px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 1.8rem;
        letter-spacing: -0.03em;
      }

      p.lede {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 0.98rem;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.92rem;
      }

      .field {
        margin-bottom: 18px;
      }

      input[type="number"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font: inherit;
        font-size: 1.05rem;
        background: #fbfdfc;
      }

      input[type="number"]:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .tips {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .tips button {
        border: 1px solid var(--line);
        background: #fbfdfc;
        border-radius: 10px;
        padding: 10px 0;
        font: inherit;
        cursor: pointer;
      }

      .tips button.active,
      .tips button:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }

      .results {
        margin-top: 8px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .row strong {
        font-size: 1.15rem;
      }

      .total {
        padding: 12px 14px;
        background: var(--accent-soft);
        border-radius: 12px;
      }

      .error {
        color: #9b2c2c;
        min-height: 1.2em;
        font-size: 0.9rem;
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Tip calculator</h1>
      <p class="lede">Enter the bill, pick a tip, and optionally split it.</p>

      <div class="field">
        <label for="bill">Bill amount</label>
        <input id="bill" type="number" min="0" step="0.01" placeholder="0.00" />
      </div>

      <div class="field">
        <label>Tip percent</label>
        <div class="tips" id="tips">
          <button type="button" data-tip="10">10%</button>
          <button type="button" data-tip="15" class="active">15%</button>
          <button type="button" data-tip="18">18%</button>
          <button type="button" data-tip="20">20%</button>
        </div>
      </div>

      <div class="field">
        <label for="customTip">Custom tip %</label>
        <input id="customTip" type="number" min="0" step="0.1" placeholder="e.g. 22" />
      </div>

      <div class="field">
        <label for="people">Number of people</label>
        <input id="people" type="number" min="1" step="1" value="1" />
      </div>

      <p class="error" id="error"></p>

      <section class="results" aria-live="polite">
        <div class="row">
          <span>Tip</span>
          <strong id="tipAmount">$0.00</strong>
        </div>
        <div class="row total">
          <span>Total</span>
          <strong id="total">$0.00</strong>
        </div>
        <div class="row">
          <span>Per person</span>
          <strong id="perPerson">$0.00</strong>
        </div>
      </section>
    </main>

    <script>
      const billInput = document.getElementById("bill");
      const customTip = document.getElementById("customTip");
      const peopleInput = document.getElementById("people");
      const errorEl = document.getElementById("error");
      const tipButtons = [...document.querySelectorAll("#tips button")];

      let selectedTip = 15;

      function money(n) {
        return "$" + n.toFixed(2);
      }

      function setActive(percent) {
        selectedTip = percent;
        tipButtons.forEach((btn) => {
          btn.classList.toggle("active", Number(btn.dataset.tip) === percent);
        });
      }

      function calculate() {
        const bill = Number(billInput.value);
        const people = Number(peopleInput.value);
        const tipPercent = customTip.value === "" ? selectedTip : Number(customTip.value);

        if (billInput.value === "") {
          errorEl.textContent = "";
          document.getElementById("tipAmount").textContent = "$0.00";
          document.getElementById("total").textContent = "$0.00";
          document.getElementById("perPerson").textContent = "$0.00";
          return;
        }

        if (!(bill >= 0) || Number.isNaN(bill)) {
          errorEl.textContent = "Enter a valid bill amount.";
          return;
        }

        if (!(tipPercent >= 0) || Number.isNaN(tipPercent)) {
          errorEl.textContent = "Enter a valid tip percent.";
          return;
        }

        if (!(people >= 1) || !Number.isInteger(people)) {
          errorEl.textContent = "Split among a whole number of people (1 or more).";
          return;
        }

        errorEl.textContent = "";
        const tip = bill * (tipPercent / 100);
        const total = bill + tip;
        document.getElementById("tipAmount").textContent = money(tip);
        document.getElementById("total").textContent = money(total);
        document.getElementById("perPerson").textContent = money(total / people);
      }

      tipButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          customTip.value = "";
          setActive(Number(btn.dataset.tip));
          calculate();
        });
      });

      [billInput, customTip, peopleInput].forEach((el) => {
        el.addEventListener("input", calculate);
      });
    </script>
  </body>
</html>
